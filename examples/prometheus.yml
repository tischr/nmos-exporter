# This is an example configuration file for prometheus to scrape the exporter

scrape_configs:
  - job_name: "nmos-exporter"

    metrics_path: /probe

    static_configs:
    # Set IP address and Node API port of NMOS nodes under targets
      - targets:
          - 172.31.9.171:8080
          - 172.31.9.172:3000

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: nmos_exporter:9080 # Set nmos-exporter address and port here
