name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: checkout  
      uses: actions/checkout@v4
    - name: build
      run: docker build . --file Dockerfile --tag tischr/nmos-exporter:latest
    - name: push
      run: |
        docker login -u tischr -p ${{ secrets.DOCKERHUB_TOKEN }}
        docker push tischr/nmos-exporter:latest