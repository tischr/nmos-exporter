name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout  
      uses: actions/checkout@v4
    - name: build
      run: docker build . --file Dockerfile --tag tischr/nmos-exporter:latest
    - name: push
      run: docker push tischr/nmos-exporter:latest
